# QZ ProForm ANT+ FE-C bridge for XIAO nRF52840

CONFIG_QZ_PROFORM_ANT_FEC=y

# ANT for nRF Connect SDK
CONFIG_ANT=y
CONFIG_ANT_CHANNEL_CONFIG=y
CONFIG_ANT_KEY_MANAGER=y
CONFIG_ANT_TOTAL_CHANNELS_ALLOCATED=1
CONFIG_ANT_EVENT_QUEUE_SIZE=32

# Prototype/evaluation only.
# A commercial or other revenue-generating release must use the appropriate
# ANT license instead of the evaluation key.
CONFIG_ANT_EVALUATION_KEY=y

# UART0 on the Zephyr XIAO BLE board is D6/TX (P1.11), D7/RX (P1.12).
CONFIG_SERIAL=y

# The hardware UART is exclusively the ESP32 <-> XIAO bridge. Keep Zephyr
# console/log output away from the protocol.
CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n
CONFIG_LOG=n
CONFIG_PRINTK=n

# sscanf() is used by the deliberately simple ASCII UART protocol.
CONFIG_NEWLIB_LIBC=y

CONFIG_MAIN_STACK_SIZE=4096
CONFIG_HEAP_MEM_POOL_SIZE=2048
