name: Fix PR 4947 Bootcamp type detection

on:
  push:
    branches:
      - codex/add-backward-compatible-inclination-mapping-extension-3shg4d

permissions:
  contents: write

jobs:
  fix:
    if: github.event.head_commit.message == 'Fix PR 4947 Bootcamp type detection'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/add-backward-compatible-inclination-mapping-extension-3shg4d
          fetch-depth: 0
      - name: Fix Tread Bootcamp discipline detection
        shell: python
        run: |
          from pathlib import Path
          path = Path('src/peloton.cpp')
          text = path.read_text()
          old = '    bootcampWorkout = current_workout_type.contains(QStringLiteral("bootcamp"), Qt::CaseInsensitive);\n'
          new = '''    bootcampWorkout = current_workout_type.contains(QStringLiteral("bootcamp"), Qt::CaseInsensitive) ||\n                       current_workout_type.compare(QStringLiteral("circuit"), Qt::CaseInsensitive) == 0;\n'''
          if text.count(old) != 1:
              raise RuntimeError(f'expected one Bootcamp assignment, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          Path('.github/workflows/fix-pr4947-bootcamp-type.yml').unlink()
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Detect Peloton Tread Bootcamp circuit workouts"
          git push origin HEAD:codex/add-backward-compatible-inclination-mapping-extension-3shg4d
