name: Apply power calibration UI integration

on:
  push:
    branches:
      - feature/power-calibration-table

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/power-calibration-table
          fetch-depth: 0

      - name: Patch settings.qml
        shell: python
        run: |
          from pathlib import Path

          path = Path("src/settings.qml")
          text = path.read_text()

          custom_gears = '''                    NewPageElement {
                        title: qsTr("Custom Gear Table")
                        indicatRectColor: Material.color(Material.Grey)
                        textColor: Material.color(Material.Yellow)
                        color: Material.backgroundColor
                        accordionContent: "customgears.qml"
                    }
'''

          power_calibration = '''

                    NewPageElement {
                        title: qsTr("Power Calibration Table")
                        indicatRectColor: Material.color(Material.Grey)
                        textColor: Material.color(Material.Yellow)
                        color: Material.backgroundColor
                        accordionContent: "powercalibration.qml"
                    }
'''

          if 'accordionContent: "powercalibration.qml"' not in text:
              if text.count(custom_gears) != 1:
                  raise SystemExit(f"Expected exactly one Custom Gear Table block, found {text.count(custom_gears)}")
              text = text.replace(custom_gears, custom_gears + power_calibration, 1)

          last_setting = '            property bool nordictrack_incline_trainer_x7i_ntl15010_0: false\n'
          new_settings = '''            property bool power_calibration_table_enabled: false
            property string power_calibration_table: "0|0\\n100|100\\n200|200\\n300|300\\n400|400\\n500|500\\n600|600"
'''

          if '            property bool power_calibration_table_enabled: false\n' not in text:
              if text.count(last_setting) != 1:
                  raise SystemExit(f"Expected exactly one final settings anchor, found {text.count(last_setting)}")
              text = text.replace(last_setting, last_setting + new_settings, 1)

          path.write_text(text)

      - name: Commit integration and remove temporary workflow
        run: |
          rm -- .github/workflows/apply-power-calibration-ui.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- src/settings.qml .github/workflows/apply-power-calibration-ui.yml
          git diff --cached --check
          git commit -m "Add power calibration page under Bike Options"
          git push origin HEAD:feature/power-calibration-table

# trigger integration
