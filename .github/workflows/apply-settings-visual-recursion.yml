name: Apply settings visual recursion patch

on:
  push:
    branches:
      - agent/settings-refactor-phase1-safety
    paths:
      - '.github/workflows/apply-settings-visual-recursion.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/settings-refactor-phase1-safety
          fetch-depth: 0

      - name: Apply patch
        run: |
          python3 scripts/apply_settings_visual_recursion.py
          git diff --check
          git diff -- src/settings.qml

      - name: Commit source change and remove staging files
        run: |
          rm scripts/apply_settings_visual_recursion.py
          rm .github/workflows/apply-settings-visual-recursion.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/settings.qml scripts/apply_settings_visual_recursion.py .github/workflows/apply-settings-visual-recursion.yml
          git commit -m 'Fix recursive modern settings visual capture'
          git push origin HEAD:agent/settings-refactor-phase1-safety
