name: PR 4770 cleanup

on:
  push:
    branches:
      - codex/ios-background-central-homeform

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: codex/ios-background-central-homeform
          fetch-depth: 0

      - name: Simplify iOS background keepalive
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin master

          # Restore homeform from master, then keep only the minimal hooks needed
          # to start/stop the opt-in iOS audio keepalive.
          git checkout origin/master -- src/homeform.cpp

          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f"{path}: expected one match, found {count}: {old[:80]!r}")
              p.write_text(text.replace(old, new, 1), encoding="utf-8")

          # homeform.cpp: keep only include + workout start/stop hooks.
          replace_once(
              "src/homeform.cpp",
              '#include "ios/ios_liveactivity.h"\n#endif',
              '#include "ios/ios_liveactivity.h"\n#include "ios/ios_background_keepalive.h"\n#endif',
          )
          replace_once(
              "src/homeform.cpp",
              '''#ifdef Q_OS_IOS\n#ifndef IO_UNDER_QT\n        if(h && !h->appleWatchAppInstalled() && bluetoothManager->device())\n            h->startWorkout(bluetoothManager->device()->deviceType());\n#endif\n#endif''',
              '''#ifdef Q_OS_IOS\n#ifndef IO_UNDER_QT\n        // Keep QZ active in background only when the user explicitly enables it.\n        if (settings.value(QZSettings::ios_background_keepalive, QZSettings::default_ios_background_keepalive)\n                .toBool())\n            iosBackgroundKeepAlive::start();\n        if(h && !h->appleWatchAppInstalled() && bluetoothManager->device())\n            h->startWorkout(bluetoothManager->device()->deviceType());\n#endif\n#endif''',
          )
          replace_once(
              "src/homeform.cpp",
              '''    // End iOS Live Activity when workout stops\n    ios_liveactivity::endLiveActivity();\n#endif''',
              '''    // End iOS Live Activity when workout stops\n    ios_liveactivity::endLiveActivity();\n    iosBackgroundKeepAlive::stop();\n#endif''',
          )

          # Default the experimental feature to OFF.
          replace_once(
              "src/qzsettings.h",
              "    static constexpr bool default_ios_background_keepalive = true;",
              "    static constexpr bool default_ios_background_keepalive = false;",
          )
          replace_once(
              "src/settings.qml",
              "            property bool ios_background_keepalive: true            ",
              "            property bool ios_background_keepalive: false",
          )

          old_description = (
              "iOS only. Keeps QZ running when the screen is off or QZ is in background, "
              "so that the Bluetooth connections and the session timers don't freeze. "
              "It uses a silent audio track mixed with your music, so nothing you're listening to is interrupted. "
              "Turn it off only if you don't need to train with the screen locked. Default is on."
          )
          new_description = (
              "iOS only. Keeps QZ running when the screen is off or QZ is in background, "
              "so that the Bluetooth connections and the session timers don't freeze. "
              "It uses a silent audio track mixed with your music, so nothing you're listening to is interrupted. "
              "Enable it if you need to train with the screen locked or with QZ in background. Default is off."
          )
          replace_once("src/settings.qml", old_description, new_description)

          # Update only the ios_background_keepalive catalog entry, preserving formatting.
          catalog_path = Path("src/settings-catalog.json")
          catalog = catalog_path.read_text(encoding="utf-8")
          marker = '      "key": "ios_background_keepalive",'
          start = catalog.index(marker)
          end = catalog.index("\n    },\n    {", start) + len("\n    }")
          block = catalog[start:end]
          if block.count('"defaultValue": true') != 1 or block.count('"defaultExpression": "true"') != 1:
              raise RuntimeError("Unexpected ios_background_keepalive catalog defaults")
          block = block.replace('"defaultValue": true', '"defaultValue": false', 1)
          block = block.replace('"defaultExpression": "true"', '"defaultExpression": "false"', 1)
          block = block.replace(old_description, new_description, 1)
          if '"restartRequired"' not in block:
              block = block.replace('      "options": null\n', '      "options": null,\n      "restartRequired": false\n', 1)
          else:
              block = block.replace('"restartRequired": true', '"restartRequired": false', 1)
          catalog_path.write_text(catalog[:start] + block + catalog[end:], encoding="utf-8")

          # Drop the CoreBluetooth initializer swizzle entirely.
          bluetooth_shim = Path("src/ios/ios_bluetooth_background.mm")
          if bluetooth_shim.exists():
              bluetooth_shim.unlink()

          pri = Path("src/qdomyos-zwift.pri")
          pri_text = pri.read_text(encoding="utf-8")
          line = "    ios/ios_bluetooth_background.mm \\\n"
          if pri_text.count(line) != 1:
              raise RuntimeError("Unexpected ios_bluetooth_background.mm entry in qdomyos-zwift.pri")
          pri.write_text(pri_text.replace(line, "", 1), encoding="utf-8")

          # The checked-in iOS Xcode project must match the qmake source list.
          project = Path("build-qdomyos-zwift-Qt_5_15_2_for_iOS-Debug/qdomyoszwift.xcodeproj/project.pbxproj")
          project_lines = project.read_text(encoding="utf-8").splitlines(keepends=True)
          filtered = [line for line in project_lines if "ios_bluetooth_background.mm" not in line]
          if len(project_lines) - len(filtered) != 3:
              raise RuntimeError(
                  f"Expected 3 ios_bluetooth_background.mm project entries, removed {len(project_lines) - len(filtered)}"
              )
          project.write_text("".join(filtered), encoding="utf-8")

          # Remove the CoreBluetooth-restoration launch logging now that the restore shim is gone.
          delegate = Path("src/ios/ios_app_delegate.mm")
          delegate_text = delegate.read_text(encoding="utf-8")
          restore_block = '''\n    // when CoreBluetooth state restoration is in place iOS can relaunch us in\n    // background to deliver a BLE event: useful to know it while reading a log\n    NSArray *restoredCentrals = [launchOptions objectForKey:UIApplicationLaunchOptionsBluetoothCentralsKey];\n    if (restoredCentrals.count > 0) {\n        qDebug() << "QZ iOS launch: relaunched by CoreBluetooth for" << (int)restoredCentrals.count << "central(s)";\n    }\n'''
          if delegate_text.count(restore_block) != 1:
              raise RuntimeError("Unexpected CoreBluetooth restore logging block")
          delegate.write_text(delegate_text.replace(restore_block, "", 1), encoding="utf-8")
          PY

          # Remove this one-shot workflow from the resulting branch.
          git rm .github/workflows/pr4770-cleanup.yml
          git add -A

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Simplify iOS background keepalive"
          git push origin HEAD:codex/ios-background-central-homeform
