name: Temporary custom incline settings patch

on:
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  patch-settings:
    if: github.event.pull_request.head.ref == 'feature/custom-incline-resistance-table'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/custom-incline-resistance-table
          fetch-depth: 0
      - name: Patch settings integration
        shell: python
        run: |
          from pathlib import Path

          # settings.qml: add a direct Bike Options page next to Custom Gear Table.
          path = Path('src/settings.qml')
          text = path.read_text()
          gear_page = '''                    NewPageElement {
                        title: qsTr("Custom Gear Table")
                        indicatRectColor: Material.color(Material.Grey)
                        textColor: Material.color(Material.Yellow)
                        color: Material.backgroundColor
                        accordionContent: "customgears.qml"
                    }
'''
          incline_page = '''
                    NewPageElement {
                        title: qsTr("Custom Inclination to Resistance Table")
                        indicatRectColor: Material.color(Material.Grey)
                        textColor: Material.color(Material.Yellow)
                        color: Material.backgroundColor
                        accordionContent: "custominclinationresistance.qml"
                    }
'''
          if text.count(gear_page) != 1:
              raise SystemExit(f'Expected one Custom Gear Table page, found {text.count(gear_page)}')
          if 'accordionContent: "custominclinationresistance.qml"' not in text:
              text = text.replace(gear_page, gear_page + incline_page, 1)

          # New persistent properties must always be appended at the end of Settings.
          tail = '''            property bool simulate_moving_when_paused: false
            property bool kickr_core_3: false
        }
'''
          new_tail = '''            property bool simulate_moving_when_paused: false
            property bool kickr_core_3: false
            property bool custom_inclination_resistance_table_enabled: false
            property string custom_inclination_resistance_table: "0|4\\
1|6\\
2|8\\
3|10\\
4|11\\
5|11.5\\
6|12\\
8|13\\
10|14\\
12|15\\
15|16"
        }
'''
          if 'property bool custom_inclination_resistance_table_enabled' not in text:
              if text.count(tail) != 1:
                  raise SystemExit(f'Expected one Settings tail, found {text.count(tail)}')
              text = text.replace(tail, new_tail, 1)
          path.write_text(text)

          # Remove the temporary navigation link from Custom Gear Table.
          path = Path('src/customgears.qml')
          text = path.read_text()
          old_link = '''        NewPageElement {
            title: qsTr("Custom Inclination to Resistance Table")
            indicatRectColor: Material.color(Material.Grey)
            textColor: Material.color(Material.Yellow)
            color: Material.backgroundColor
            accordionContent: "custominclinationresistance.qml"
        }

'''
          text = text.replace(old_link, '', 1)
          path.write_text(text)

          # Dedicated page: declare and use the settings as QML properties.
          path = Path('src/custominclinationresistance.qml')
          text = path.read_text()
          text = text.replace('''    Settings {
        id: settings
    }
''', '''    Settings {
        id: settings
        property bool custom_inclination_resistance_table_enabled: false
        property string custom_inclination_resistance_table: defaultInclinationResistanceTable
    }
''')
          text = text.replace('''        inclinationResistanceTable.text = settings.value("custom_inclination_resistance_table",
                                                         defaultInclinationResistanceTable)
''', '''        inclinationResistanceTable.text = settings.custom_inclination_resistance_table
''')
          text = text.replace('checked: settings.value("custom_inclination_resistance_table_enabled", false)', 'checked: settings.custom_inclination_resistance_table_enabled')
          text = text.replace('''                if (checked && !settings.value("custom_inclination_resistance_table", "")) {
                    settings.setValue("custom_inclination_resistance_table", defaultInclinationResistanceTable)
                    inclinationResistanceTable.text = defaultInclinationResistanceTable
                }
                settings.setValue("custom_inclination_resistance_table_enabled", checked)
''', '''                if (checked && !settings.custom_inclination_resistance_table) {
                    settings.custom_inclination_resistance_table = defaultInclinationResistanceTable
                    inclinationResistanceTable.text = defaultInclinationResistanceTable
                }
                settings.custom_inclination_resistance_table_enabled = checked
''')
          text = text.replace('settings.setValue("custom_inclination_resistance_table", inclinationResistanceTable.text)', 'settings.custom_inclination_resistance_table = inclinationResistanceTable.text')
          text = text.replace('settings.setValue("custom_inclination_resistance_table", defaultInclinationResistanceTable)', 'settings.custom_inclination_resistance_table = defaultInclinationResistanceTable')
          path.write_text(text)

          # settings-catalog.json: preserve formatting and append the new page/settings.
          path = Path('src/settings-catalog.json')
          text = path.read_text()
          if '"page_custom_inclination_resistance_table"' not in text:
              marker = '''    {
      "key": "page_custom_gear_table",
'''
              page_entry = '''    {
      "key": "page_custom_inclination_resistance_table",
      "name": "Custom Inclination to Resistance Table",
      "description": "Configure how virtual-app inclination maps to bike resistance.",
      "parent": "Bike Options",
      "type": "page",
      "control": "page",
      "target": "custominclinationresistance.qml",
      "visible": true
    },
'''
              if text.count(marker) != 1:
                  raise SystemExit('Could not locate page_custom_gear_table')
              text = text.replace(marker, page_entry + marker, 1)

          if '"key": "custom_inclination_resistance_table_enabled"' not in text:
              # Locate the end of the top-level settings array without reformatting the file.
              start = text.index('"settings": [') + len('"settings": ')
              in_string = False
              escaped = False
              depth = 0
              end = None
              for i in range(start, len(text)):
                  ch = text[i]
                  if in_string:
                      if escaped:
                          escaped = False
                      elif ch == '\\':
                          escaped = True
                      elif ch == '"':
                          in_string = False
                      continue
                  if ch == '"':
                      in_string = True
                  elif ch == '[':
                      depth += 1
                  elif ch == ']':
                      depth -= 1
                      if depth == 0:
                          end = i
                          break
              if end is None:
                  raise SystemExit('Could not locate settings array end')
              entries = ''',
    {
      "key": "custom_inclination_resistance_table_enabled",
      "name": "Enable Custom Inclination to Resistance Table",
      "description": "Use a custom mapping when QZ converts virtual-app inclination into resistance.",
      "parent": "Bike Options",
      "type": "boolean",
      "control": "switch",
      "defaultValue": false,
      "options": null,
      "visible": true
    },
    {
      "key": "custom_inclination_resistance_table",
      "name": "Custom Inclination to Resistance Table",
      "description": "One inclination|resistance pair per line. QZ interpolates between points and clamps outside the configured range.",
      "parent": "custom_inclination_resistance_table_enabled",
      "type": "string",
      "control": "text",
      "defaultValue": "0|4\\n1|6\\n2|8\\n3|10\\n4|11\\n5|11.5\\n6|12\\n8|13\\n10|14\\n12|15\\n15|16",
      "options": null,
      "visible": true
    }
  '''
              text = text[:end].rstrip() + entries + text[end:]
              text = text.replace('"settingCount": 968', '"settingCount": 970', 1)
          path.write_text(text)

          # This helper workflow is intentionally self-removing.
          Path('.github/workflows/tmp-custom-incline-settings-patch.yml').unlink()
      - name: Commit settings integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- src/settings.qml src/customgears.qml src/custominclinationresistance.qml src/settings-catalog.json .github/workflows/tmp-custom-incline-settings-patch.yml
          git commit -m "Integrate custom incline table into Bike Options"
          git push origin HEAD:feature/custom-incline-resistance-table
