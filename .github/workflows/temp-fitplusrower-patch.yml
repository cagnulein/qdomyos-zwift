name: Temporary FitPlus rower integration patch

on:
  push:
    branches:
      - fix/merach-r28-fitplusrower

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/merach-r28-fitplusrower
          fetch-depth: 0

      - name: Apply integration changes
        run: python3 tools/apply_fitplusrower_patch.py

      - name: Commit integration changes
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/devices/bluetooth.cpp src/qdomyos-zwift.pri tst/Devices/devicetestdataindex.cpp
          git commit -m "feat: route Merach R28 through FitPlus rower"
          git push origin HEAD:fix/merach-r28-fitplusrower
