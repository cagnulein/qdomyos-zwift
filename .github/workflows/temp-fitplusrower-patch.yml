name: Temporary FitPlus rower integration patch

on:
  push:
    branches:
      - fix/merach-r28-fitplusrower

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/merach-r28-fitplusrower
          fetch-depth: 0

      - name: Apply integration changes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          bluetooth_path = Path('src/devices/bluetooth.cpp')
          bluetooth = bluetooth_path.read_text()

          if 'fitPlusRower = new fitplusrower' not in bluetooth:
              ftms_start = '            } else if ((b.name().toUpper().startsWith(QStringLiteral("CR 00")) ||'
              dedicated = '''            } else if (b.name().toUpper().startsWith(QStringLiteral("MRK-R28-")) &&
                       !fitPlusRower && filter) {
                // Support case: matthieu.f.graveleau@gmail.com, debug-Wed_Sep_9_22_16_00_2026.log.txt.
                // The R28 advertises FTMS, but QZ 2.20.29 successfully used the proprietary FFF0 Merach protocol.
                this->setLastBluetoothDevice(b);
                this->stopDiscovery();
                fitPlusRower = new fitplusrower(noWriteResistance, noHeartService, bikeResistanceOffset,
                                                bikeResistanceGain);
                emit deviceConnected(b);
                connect(fitPlusRower, &bluetoothdevice::connectedAndDiscovered, this,
                        &bluetooth::connectedAndDiscovered);
                fitPlusRower->deviceDiscovered(b);
                this->signalBluetoothDeviceConnected(fitPlusRower);
'''
              if ftms_start not in bluetooth:
                  raise SystemExit('FTMS rower discovery anchor not found')
              bluetooth = bluetooth.replace(ftms_start, dedicated + ftms_start, 1)

              bluetooth, removed = re.subn(
                  r'^[ \t]*b\.name\(\)\.toUpper\(\)\.startsWith\(QStringLiteral\("MRK-R28-"\)\) \|\|\r?\n',
                  '', bluetooth, count=1, flags=re.MULTILINE)
              if removed != 1:
                  raise SystemExit('MRK-R28 FTMS rower entry not found')

              cleanup = '''    if (fitPlusBike) {
        delete fitPlusBike;
        fitPlusBike = nullptr;
    }
'''
              cleanup_with_rower = cleanup + '''    if (fitPlusRower) {
        delete fitPlusRower;
        fitPlusRower = nullptr;
    }
'''
              if cleanup not in bluetooth:
                  raise SystemExit('FitPlus bike cleanup anchor not found')
              bluetooth = bluetooth.replace(cleanup, cleanup_with_rower, 1)

              device_return = '''    } else if (fitPlusBike) {
        return fitPlusBike;
'''
              device_return_with_rower = '''    } else if (fitPlusBike) {
        return fitPlusBike;
    } else if (fitPlusRower) {
        return fitPlusRower;
'''
              if device_return not in bluetooth:
                  raise SystemExit('FitPlus bike device() anchor not found')
              bluetooth = bluetooth.replace(device_return, device_return_with_rower, 1)

              bluetooth_path.write_text(bluetooth)

          pri_path = Path('src/qdomyos-zwift.pri')
          pri = pri_path.read_text()
          if 'devices/fitplusrower/fitplusrower.cpp' not in pri:
              source_anchor = 'devices/fitplusbike/fitplusbike.cpp \\\n'
              if source_anchor not in pri:
                  raise SystemExit('FitPlus source anchor not found')
              pri = pri.replace(source_anchor,
                                source_anchor + 'devices/fitplusrower/fitplusrower.cpp \\\n', 1)
          if 'devices/fitplusrower/fitplusrower.h' not in pri:
              header_anchor = 'devices/fitplusbike/fitplusbike.h \\\n'
              if header_anchor not in pri:
                  raise SystemExit('FitPlus header anchor not found')
              pri = pri.replace(header_anchor,
                                header_anchor + 'devices/fitplusrower/fitplusrower.h \\\n', 1)
          pri_path.write_text(pri)

          test_path = Path('tst/Devices/devicetestdataindex.cpp')
          tests = test_path.read_text()
          if 'DeviceIndex::FitPlusRower_MRK_R28' not in tests:
              old = '''    // FitPlus MRK
    RegisterNewDeviceTestData(DeviceIndex::FitPlusBike_MRK_NoSettings)
        ->expectDevice<fitplusbike>()
        ->acceptDeviceName("MRK-", DeviceNameComparison::StartsWith)
        ->excluding<ftmsbike>()
        ->excluding<snodebike>();
'''
              new = '''    // FitPlus Rower - Merach R28
    // Reproduces the support case from matthieu.f.graveleau@gmail.com:
    // debug-Wed_Sep_9_22_16_00_2026.log.txt reported MRK-R28-6B51.
    RegisterNewDeviceTestData(DeviceIndex::FitPlusRower_MRK_R28)
        ->expectDevice<fitplusrower>()
        ->acceptDeviceName("MRK-R28-6B51", DeviceNameComparison::Exact);

    // FitPlus MRK
    RegisterNewDeviceTestData(DeviceIndex::FitPlusBike_MRK_NoSettings)
        ->expectDevice<fitplusbike>()
        ->acceptDeviceName("MRK-", DeviceNameComparison::StartsWith)
        ->rejectDeviceName("MRK-R28-", DeviceNameComparison::StartsWithIgnoreCase)
        ->excluding<ftmsbike>()
        ->excluding<fitplusrower>()
        ->excluding<snodebike>();
'''
              if old not in tests:
                  raise SystemExit('FitPlus MRK test anchor not found')
              tests = tests.replace(old, new, 1)
              test_path.write_text(tests)
          PY

      - name: Commit integration changes
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/devices/bluetooth.cpp src/qdomyos-zwift.pri tst/Devices/devicetestdataindex.cpp
          git commit -m "feat: route Merach R28 through FitPlus rower"
          git push origin HEAD:fix/merach-r28-fitplusrower
