name: Rebuild PR 4803 settings

on:
  push:
    branches: [rebuild-4803-seq]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rebuild-4803-seq
          fetch-depth: 0
      - name: Patch files
        run: python3 .github/scripts/rebuild_4803.py
      - name: Commit aligned branch
        run: |
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Align PR 4803 settings with current master"
          git push origin HEAD:rebuild-4803-seq
