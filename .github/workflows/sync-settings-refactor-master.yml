name: Sync settings refactor with master

on:
  pull_request:
    branches:
      - agent/settings-refactor-phase1-safety
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  sync:
    if: github.head_ref == 'agent/settings-sync-runner'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/settings-refactor-phase1-safety
          fetch-depth: 0
      - name: Merge current master and resolve generated settings files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin master
          BASE=$(git merge-base HEAD origin/master)
          echo "merge base: $BASE"
          echo "master: $(git rev-parse origin/master)"

          if git merge --no-commit --no-ff origin/master; then
            echo "Master merged without conflicts"
          else
            echo "Resolving expected settings conflicts"
            UNMERGED=$(git diff --name-only --diff-filter=U)
            echo "$UNMERGED"
            for path in $UNMERGED; do
              case "$path" in
                src/settings.qml|src/settings-catalog.json)
                  git checkout --ours -- "$path"
                  git add "$path"
                  ;;
                *)
                  echo "Unexpected merge conflict: $path" >&2
                  exit 1
                  ;;
              esac
            done

            git diff "$BASE" origin/master -- src/settings.qml > /tmp/master-settings.patch
            if [ -s /tmp/master-settings.patch ]; then
              git apply --3way --index /tmp/master-settings.patch
            fi

            python3 - "$BASE" <<'PY'
          import copy, json, subprocess, sys
          from pathlib import Path

          base = sys.argv[1]
          path = Path('src/settings-catalog.json')
          current = json.loads(path.read_text(encoding='utf-8'))
          master = json.loads(subprocess.check_output(['git','show','origin/master:src/settings-catalog.json'], text=True))
          base_catalog = json.loads(subprocess.check_output(['git','show',f'{base}:src/settings-catalog.json'], text=True))

          def keyed(section, doc):
              return {e.get('key'): e for e in doc.get(section, []) if e.get('key')}

          def merge_options(cur, new):
              if not isinstance(new, list):
                  return copy.deepcopy(new)
              if not isinstance(cur, list):
                  cur = []
              result = copy.deepcopy(cur)
              def ident(v):
                  if isinstance(v, dict):
                      return ('dict', v.get('sets'), v.get('value'), v.get('label'))
                  return ('value', json.dumps(v, sort_keys=True, ensure_ascii=False))
              seen = {ident(v) for v in result}
              for v in new:
                  if ident(v) not in seen:
                      result.append(copy.deepcopy(v))
                      seen.add(ident(v))
              return result

          sentinel = object()
          for section in ('pages','virtualSettings','settings'):
              cur_list = current.setdefault(section, [])
              cur_map = keyed(section, current)
              old_map = keyed(section, base_catalog)
              new_map = keyed(section, master)
              for key, mentry in new_map.items():
                  if key not in old_map:
                      if key not in cur_map:
                          entry = copy.deepcopy(mentry)
                          if section in ('settings','virtualSettings'):
                              entry.setdefault('restartRequired', True)
                          cur_list.append(entry)
                          cur_map[key] = entry
                      continue
                  old = old_map[key]
                  if mentry == old or key not in cur_map:
                      continue
                  centry = cur_map[key]
                  for field, mvalue in mentry.items():
                      ovalue = old.get(field, sentinel)
                      if mvalue == ovalue:
                          continue
                      if field == 'options' and isinstance(mvalue, list):
                          centry[field] = merge_options(centry.get(field), mvalue)
                      elif centry.get(field, sentinel) == ovalue:
                          centry[field] = copy.deepcopy(mvalue)

          current['settingCount'] = len(current.get('settings', []))
          path.write_text(json.dumps(current, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')
          PY

            git add src/settings.qml src/settings-catalog.json
          fi

          python3 scripts/settings_layout.py --write
          git add src/settings-catalog.json
          python3 -m unittest tests/test_settings_audit.py tests/test_settings_behavior_migration.py tests/test_modern_settings_preview.py tests/test_settings_layout.py tests/test_settings_ios_layout.py
          python3 scripts/settings_layout.py

          git commit -m "Merge master into settings refactor"
          git push origin HEAD:agent/settings-refactor-phase1-safety
