name: Qt 6 Linux build

on:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Checkout SMTP client
        uses: actions/checkout@v4
        with:
          repository: bluetiger9/SmtpClient-for-Qt
          ref: 3fa4a0fe5797070339422cf18b5e9ed8dcb91f9c
          path: src/smtpclient
      - name: Checkout Google Test
        uses: actions/checkout@v4
        with:
          repository: google/googletest
          ref: release-1.12.1
          path: tst/googletest
      - name: Install build dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends build-essential libgl1-mesa-dev \
            libxcb-randr0-dev libxcb-xtest0-dev libxcb-xinerama0-dev libxcb-shape0-dev libxcb-xkb-dev
      - name: Install Qt 6
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.5.1'
          host: linux
          target: desktop
          modules: 'qtnetworkauth qtcharts qtconnectivity qtpositioning qtwebsockets qtlocation qtmultimedia qtwebview qtspeech qthttpserver'
          install-deps: true
      - name: Build QZ
        run: |
          qmake qdomyos-zwift.pro
          make -j2
      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: ./tst/qdomyos-zwift-tests
