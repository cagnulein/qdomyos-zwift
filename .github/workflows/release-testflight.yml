name: Release iOS to TestFlight

on:
  pull_request:
    branches:
      - master
    types:
      - labeled
  workflow_dispatch:
    inputs:
      publish:
        description: Upload the signed IPA to App Store Connect TestFlight
        type: boolean
        required: true
        default: false

concurrency:
  group: release-testflight
  cancel-in-progress: false

jobs:
  release-ios:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master') ||
      (github.event_name == 'pull_request' &&
       github.event.label.name == 'testflight-upload' &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: macos-26
    timeout-minutes: 180
    permissions:
      contents: read

    steps:
      - name: Checkout repository and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Select the Xcode version used by Xcode Cloud scripts
        run: |
          XCODE=$(ls -d /Applications/Xcode_*.app | sort -V | tail -n 1)
          test -n "$XCODE"
          sudo ln -sfn "$XCODE" /Applications/Xcode.app
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'

      - name: Install Fastlane
        run: gem install fastlane --version 2.230.0 --no-document

      - name: Prepare App Store Connect API key
        env:
          ASC_API_KEY_BASE64: ${{ secrets.ASC_API_KEY_BASE64 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          if [ -z "$ASC_API_KEY_BASE64" ] || [ -z "$ASC_KEY_ID" ] || [ -z "$ASC_ISSUER_ID" ]; then
            echo "ASC_API_KEY_BASE64, ASC_KEY_ID, and ASC_ISSUER_ID GitHub secrets are required."
            exit 1
          fi
          KEY_PATH="$RUNNER_TEMP/AuthKey_${ASC_KEY_ID}.p8"
          printf '%s' "$ASC_API_KEY_BASE64" | tr -d '[:space:]' | base64 -D > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          if [ ! -s "$KEY_PATH" ]; then
            echo "Could not decode the App Store Connect API key."
            exit 1
          fi
          if ! openssl pkey -in "$KEY_PATH" -noout >/dev/null 2>&1; then
            echo "The decoded App Store Connect API key is not a valid private key."
            exit 1
          fi
          echo "ASC_API_KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"

      - name: Install persistent iOS development signing identity
        env:
          IOS_DEVELOPMENT_CERTIFICATE_BASE64: ${{ secrets.IOS_DEVELOPMENT_CERTIFICATE_BASE64 }}
          IOS_DEVELOPMENT_CERTIFICATE_PASSWORD: ${{ secrets.IOS_DEVELOPMENT_CERTIFICATE_PASSWORD }}
        run: |
          if [ -z "$IOS_DEVELOPMENT_CERTIFICATE_BASE64" ] || [ -z "$IOS_DEVELOPMENT_CERTIFICATE_PASSWORD" ]; then
            echo "IOS_DEVELOPMENT_CERTIFICATE_BASE64 and IOS_DEVELOPMENT_CERTIFICATE_PASSWORD GitHub secrets are required."
            exit 1
          fi

          KEYCHAIN_PATH="$RUNNER_TEMP/ios-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 32)"
          CERTIFICATE_PATH="$RUNNER_TEMP/ios-signing.p12"
          printf '%s' "$IOS_DEVELOPMENT_CERTIFICATE_BASE64" | tr -d '[:space:]' | base64 -D > "$CERTIFICATE_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -k "$KEYCHAIN_PATH" -P "$IOS_DEVELOPMENT_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" "$HOME/Library/Keychains/login.keychain-db"
          security default-keychain -d user -s "$KEYCHAIN_PATH"

          CERTIFICATE_SUBJECT="$(openssl pkcs12 -in "$CERTIFICATE_PATH" -passin "env:IOS_DEVELOPMENT_CERTIFICATE_PASSWORD" -clcerts -nokeys 2>/dev/null | openssl x509 -noout -subject -nameopt RFC2253)"
          case "$CERTIFICATE_SUBJECT" in
            *"CN=Apple Development:"*) ;;
            *)
              echo "The uploaded .p12 does not contain an Apple Development certificate."
              exit 1
              ;;
          esac
          case "$CERTIFICATE_SUBJECT" in
            *"OU=6335M7T29D"*) ;;
            *)
              echo "The uploaded Apple Development certificate is not for team 6335M7T29D."
              exit 1
              ;;
          esac

          IDENTITIES="$(security find-identity -v -p codesigning "$KEYCHAIN_PATH")"
          case "$IDENTITIES" in
            *"Apple Development:"*) ;;
            *)
              echo "The imported keychain does not contain a usable Apple Development identity."
              exit 1
              ;;
          esac

      - name: Run the Xcode Cloud setup scripts
        env:
          CI_PRIMARY_REPOSITORY_PATH: ${{ github.workspace }}
          STRAVA_SECRET_KEY: ${{ secrets.strava_secret_key }}
          PELOTON_SECRET_KEY: ${{ secrets.peloton_secret_key }}
          SMTP_USERNAME: ${{ secrets.smtp_username }}
          SMTP_PASSWORD: ${{ secrets.smtp_password }}
          SMTP_SERVER: ${{ secrets.smtp_server }}
          INTERVALSICU_CLIENT_ID: ${{ secrets.intervalsicu_client_id }}
          INTERVALSICU_CLIENT_SECRET: ${{ secrets.intervalsicu_client_secret }}
          CESIUMKEY: ${{ secrets.cesiumkey }}
        run: |
          sudo mkdir -p /Volumes/workspace
          sudo ln -sfn "$GITHUB_WORKSPACE" /Volumes/workspace/repository
          cd build-qdomyos-zwift-Qt_5_15_2_for_iOS-Debug/ci_scripts
          bash ci_post_clone.sh
          bash ci_pre_xcodebuild.sh

      - name: Prepare the generated Xcode project for iOS builds
        run: |
          python3 .github/scripts/ios_simulator_project.py \
            build-qdomyos-zwift-Qt_5_15_2_for_iOS-Debug/qdomyoszwift.xcodeproj/project.pbxproj

      - name: Build and upload to TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          PUBLISH_TO_TESTFLIGHT: ${{ github.event_name == 'pull_request' || inputs.publish }}
          TESTFLIGHT_CHANGELOG: "Branch: ${{ github.head_ref || github.ref_name }}"
        run: |
          if [ "$PUBLISH_TO_TESTFLIGHT" = "true" ]; then
            fastlane ios testflight
          else
            fastlane ios build_release
          fi

      - name: Upload the IPA artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-testflight-${{ github.run_number }}
          path: |
            build/ios/export/*.ipa
          if-no-files-found: warn
          retention-days: 14

      - name: Remove the temporary API key
        if: always()
        run: |
          if [ -n "$ASC_API_KEY_PATH" ]; then
            rm -f "$ASC_API_KEY_PATH"
          fi

      - name: Remove temporary iOS signing assets
        if: always()
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/ios-signing.keychain-db"
          security delete-keychain "$KEYCHAIN_PATH" 2>/dev/null || true
          security default-keychain -d user -s "$HOME/Library/Keychains/login.keychain-db" 2>/dev/null || true
          security list-keychains -d user -s "$HOME/Library/Keychains/login.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/ios-signing.p12"
