name: Settings parity report

on:
  pull_request:
    paths:
      - 'src/settings*.qml'
      - 'src/settings-catalog.json'
      - 'scripts/settings_parity.py'
      - 'scripts/phase5_navigation_state.py'
      - '.github/workflows/settings-parity.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  parity:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/settings-refactor-phase1-safety
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply navigation state migration once
        run: |
          set -euo pipefail
          python scripts/phase5_navigation_state.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/settings.qml
          if ! git diff --cached --quiet; then
            git commit -m 'Preserve modern settings navigation state'
            git push origin HEAD:agent/settings-refactor-phase1-safety
          fi
      - name: Install report dependency
        run: python -m pip install pillow
      - name: Build semantic parity report
        run: python scripts/settings_parity.py --out settings-parity-report
      - name: Upload settings parity report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: settings-parity-report
          path: settings-parity-report/
          retention-days: 14
      - name: Enforce high-confidence control parity
        run: python scripts/settings_parity.py --out settings-parity-report --fail-on-mismatch
