name: Add Elite Nero FTMS detection

on:
  push:
    branches:
      - add-elite-nero-ftms

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: add-elite-nero-ftms
          fetch-depth: 0
      - name: Add Nero FTMS matcher and remove temporary workflow
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("src/devices/bluetooth.cpp")
          text = path.read_text()
          old = '(b.name().toUpper().startsWith("SUITO")) || (b.name().toUpper().startsWith("D2RIDE")) ||'
          new = '(b.name().toUpper().startsWith("NERO")) || (b.name().toUpper().startsWith("SUITO")) || (b.name().toUpper().startsWith("D2RIDE")) ||'
          if 'startsWith("NERO")' in text:
              raise SystemExit("NERO matcher already exists")
          if text.count(old) != 1:
              raise SystemExit(f"Expected exactly one FTMS anchor, found {text.count(old)}")
          path.write_text(text.replace(old, new, 1))
          PY
          git rm .github/workflows/add-elite-nero-ftms.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/devices/bluetooth.cpp
          git commit -m "Add Elite Nero FTMS bike detection"
          git push origin HEAD:add-elite-nero-ftms
