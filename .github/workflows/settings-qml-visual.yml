name: Settings QML visual parity

# Keep this workflow directly triggerable by maintainer commits while validating runtime parity.
on:
  pull_request:
    paths:
      - 'src/settings*.qml'
      - 'src/main.qml'
      - 'src/AccordionElement.qml'
      - 'src/settings-catalog.json'
      - 'scripts/settings_visual_report.py'
      - '.github/workflows/settings-qml-visual.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: settings-qml-visual-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  DISPLAY: ':99'

jobs:
  qml-visual:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Start Xvfb
        run: |
          sudo apt-get update -y
          sudo apt-get install -y xvfb
          Xvfb -ac $DISPLAY -screen 0 1280x780x24 &

      - name: Checkout SMTP client
        uses: actions/checkout@v4
        with:
          repository: bluetiger9/SmtpClient-for-Qt
          path: src/smtpclient/
          ref: 3fa4a0fe5797070339422cf18b5e9ed8dcb91f9c

      - name: Checkout qHttpServer
        uses: actions/checkout@v4
        with:
          repository: qt-labs/qthttpserver
          path: src/qthttpserver

      - name: Install Linux runtime/build packages
        run: |
          sudo apt-get install -y qtbase5-dev qtchooser qt5-qmake qtbase5-dev-tools qttools5-dev-tools \
            qtquickcontrols2-5-dev libqt5bluetooth5 libqt5widgets5 libqt5positioning5 libqt5xml5 \
            qtconnectivity5-dev qtpositioning5-dev libqt5charts5-dev libqt5charts5 \
            libqt5networkauth5-dev 'libqt5websockets5*' libxcb-randr0-dev libxcb-xtest0-dev \
            libxcb-xinerama0-dev libxcb-shape0-dev libxcb-xkb-dev libqt5sql5-sqlite libqt5sql5

      - name: Install Qt 5.15.2
        uses: jurplel/install-qt-action@v3
        with:
          version: '5.15.2'
          host: linux
          modules: 'qtnetworkauth qtcharts'
          cache: true
          cache-key-prefix: install-qt-action-settings-visual

      - name: Build qHttpServer
        run: |
          cp qHttpServerBin/5.15.2/headers/* src/qthttpserver/src/3rdparty/http-parser/
          cd src/qthttpserver
          qmake
          make -j8
          make install

      - name: Compile QZ Linux desktop
        run: |
          qmake
          make -j8

      - name: Capture runtime legacy and modern settings
        run: |
          set -euo pipefail
          report_dir="${{ github.workspace }}/settings-qml-visual-report"
          raw_dir="$report_dir/raw"
          root_runtime_dir="${RUNNER_TEMP}/qz-settings-visual-root-runtime"

          rm -rf "$report_dir"
          mkdir -p "$raw_dir"
          : > "$report_dir/runtime.log"

          # QZ deliberately requires root on Linux. Do not let that root process inherit
          # the runner user's XDG runtime directory: QtMultimedia/PulseAudio can otherwise
          # retry against /run/user/1001 for the whole capture timeout before QML starts.
          sudo rm -rf "$root_runtime_dir"
          sudo install -d -m 0700 -o root -g root "$root_runtime_dir"

          # Stream harness progress into the Actions log while preserving the full log artifact.
          tail -n +1 -F "$report_dir/runtime.log" &
          tail_pid=$!
          cleanup_tail() {
            kill "$tail_pid" 2>/dev/null || true
          }
          trap cleanup_tail EXIT

          set +e
          # Full recursive traversal is intentionally bounded, but can legitimately produce
          # hundreds of screenshots before the legacy pass begins.
          sudo -E env XDG_RUNTIME_DIR="$root_runtime_dir" \
            timeout --signal=TERM --kill-after=10s 900s ./src/qdomyos-zwift \
            --settings-visual-test \
            --settings-visual-output="$raw_dir" \
            >> "$report_dir/runtime.log" 2>&1
          app_status=$?
          set -e

          cleanup_tail
          trap - EXIT

          # Screenshots are created by the root QZ process. Normalize ownership before
          # diagnostics/report generation/upload so the artifact is always consumable.
          sudo chown -R "$(id -u):$(id -g)" "$report_dir"
          chmod -R u+rwX "$report_dir"

          echo "visual harness exit status: $app_status"
          grep 'SETTINGS_VISUAL:' "$report_dir/runtime.log" || true
          echo "runtime files produced:"
          find "$raw_dir" -maxdepth 1 -type f -printf '%f\n' | sort || true
          modern_count=$(find "$raw_dir" -type f -name 'modern-*.png' | wc -l)
          legacy_count=$(find "$raw_dir" -type f -name 'legacy-*.png' | wc -l)
          unreadable_count=$(find "$raw_dir" -type f -name '*.png' ! -readable | wc -l)
          empty_count=$(find "$raw_dir" -type f -name '*.png' -size 0 | wc -l)
          echo "runtime modern screenshot count: $modern_count"
          echo "runtime legacy screenshot count: $legacy_count"
          echo "runtime unreadable screenshot count: $unreadable_count"
          echo "runtime empty screenshot count: $empty_count"

          test "$app_status" -eq 0
          grep -q 'SETTINGS_VISUAL: modern traversal complete' "$report_dir/runtime.log"
          grep -q 'SETTINGS_VISUAL: capture complete' "$report_dir/runtime.log"
          test "$modern_count" -gt 0
          test "$legacy_count" -gt 0
          test "$unreadable_count" -eq 0
          test "$empty_count" -eq 0
          python3 scripts/settings_visual_report.py \
            --raw "$raw_dir" \
            --out "$report_dir"

      - name: Upload QML visual comparison
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: settings-qml-visual-report
          path: settings-qml-visual-report/
          retention-days: 14
          if-no-files-found: warn
