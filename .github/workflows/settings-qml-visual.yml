name: Settings QML visual parity

on:
  pull_request:
    paths:
      - 'src/settings*.qml'
      - 'src/main.qml'
      - 'src/settings-catalog.json'
      - 'scripts/settings_visual_report.py'
      - '.github/workflows/settings-qml-visual.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  DISPLAY: ':99'

jobs:
  qml-visual:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Start Xvfb
        run: |
          sudo apt-get update -y
          sudo apt-get install -y xvfb
          Xvfb -ac $DISPLAY -screen 0 1280x780x24 &

      - name: Checkout SMTP client
        uses: actions/checkout@v4
        with:
          repository: bluetiger9/SmtpClient-for-Qt
          path: src/smtpclient/
          ref: 3fa4a0fe5797070339422cf18b5e9ed8dcb91f9c

      - name: Checkout qHttpServer
        uses: actions/checkout@v4
        with:
          repository: qt-labs/qthttpserver
          path: src/qthttpserver

      - name: Install Linux runtime/build packages
        run: |
          sudo apt-get install -y qtbase5-dev qtchooser qt5-qmake qtbase5-dev-tools qttools5-dev-tools \
            qtquickcontrols2-5-dev libqt5bluetooth5 libqt5widgets5 libqt5positioning5 libqt5xml5 \
            qtconnectivity5-dev qtpositioning5-dev libqt5charts5-dev libqt5charts5 \
            libqt5networkauth5-dev 'libqt5websockets5*' libxcb-randr0-dev libxcb-xtest0-dev \
            libxcb-xinerama0-dev libxcb-shape0-dev libxcb-xkb-dev libqt5sql5-sqlite libqt5sql5

      - name: Install Qt 5.15.2
        uses: jurplel/install-qt-action@v3
        with:
          version: '5.15.2'
          host: linux
          modules: 'qtnetworkauth qtcharts'
          cache: true
          cache-key-prefix: install-qt-action-settings-visual

      - name: Build qHttpServer
        run: |
          cp qHttpServerBin/5.15.2/headers/* src/qthttpserver/src/3rdparty/http-parser/
          cd src/qthttpserver
          qmake
          make -j8
          make install

      - name: Compile QZ Linux desktop
        run: |
          qmake
          make -j8

      - name: Capture runtime legacy and modern settings
        run: |
          set -euo pipefail
          rm -rf settings-qml-visual-report
          mkdir -p settings-qml-visual-report/raw
          set +e
          sudo -E timeout 210s ./src/qdomyos-zwift \
            --settings-visual-test \
            --settings-visual-output="${{ github.workspace }}/settings-qml-visual-report/raw" \
            > settings-qml-visual-report/runtime.log 2>&1
          app_status=$?
          set -e
          echo "visual harness exit status: $app_status"
          grep 'SETTINGS_VISUAL:' settings-qml-visual-report/runtime.log || true
          count=$(find settings-qml-visual-report/raw -name '*.png' | wc -l)
          echo "runtime screenshot count: $count"
          test "$count" -gt 1
          python3 scripts/settings_visual_report.py \
            --raw settings-qml-visual-report/raw \
            --out settings-qml-visual-report

      - name: Upload QML visual comparison
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: settings-qml-visual-report
          path: settings-qml-visual-report/
          retention-days: 14
          if-no-files-found: warn
