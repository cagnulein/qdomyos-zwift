name: Settings catalog validation

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-responsive-settings-fix:
    if: github.event_name == 'pull_request' && github.head_ref == 'fix/settings-long-translations'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Apply width-safe settings layout
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          settings_path = Path('src/settings.qml')
          text = settings_path.read_text()

          old_width = '        contentWidth: -1\n'
          new_width = '        // Settings is a vertical page: never let a wide translated child enlarge the viewport.\n        contentWidth: availableWidth\n'
          if text.count(old_width) != 1:
              raise SystemExit(f'Expected exactly one ScrollView contentWidth guard, found {text.count(old_width)}')
          text = text.replace(old_width, new_width, 1)

          old_buttons = '''                    RowLayout {
                        Layout.fillWidth: true

                        Button {
                            id: clearLogs
                            text: qsTr("Clear History")
                            Layout.alignment: Qt.AlignLeft | Qt.AlignVCenter
                            onClicked: rootItem.clearFiles();
                        }

                        Button {
                            text: qsTr("Show Logs Folder")
                            Layout.alignment: Qt.AlignRight | Qt.AlignVCenter
                            onClicked: {
                                toast.show(rootItem.getProfileDir())
                            }
                        }
                    }
'''
          new_buttons = '''                    GridLayout {
                        id: logsButtonsLayout
                        Layout.fillWidth: true
                        Layout.minimumWidth: 0
                        columns: width >= clearLogs.implicitWidth + showLogs.implicitWidth + columnSpacing ? 2 : 1

                        Button {
                            id: clearLogs
                            text: qsTr("Clear History")
                            Layout.fillWidth: true
                            Layout.minimumWidth: 0
                            onClicked: rootItem.clearFiles();
                        }

                        Button {
                            id: showLogs
                            text: qsTr("Show Logs Folder")
                            Layout.fillWidth: true
                            Layout.minimumWidth: 0
                            onClicked: {
                                toast.show(rootItem.getProfileDir())
                            }
                        }
                    }
'''
          if text.count(old_buttons) != 1:
              raise SystemExit(f'Expected exactly one log actions row, found {text.count(old_buttons)}')
          text = text.replace(old_buttons, new_buttons, 1)
          settings_path.write_text(text)

          test_path = Path('tst/ToolTests/testsettingstestsuite.cpp')
          test = test_path.read_text()
          anchor = '''    EXPECT_LT(titlePosition - delegatePosition, 600);
}'''
          replacement = '''    EXPECT_LT(titlePosition - delegatePosition, 600);

    // No translated control may enlarge the vertical settings page beyond the
    // visible viewport. This protects labels, buttons, combo boxes and future
    // controls with a large implicit width.
    EXPECT_TRUE(settingsSource.contains("contentWidth: availableWidth"));

    // Concrete regression case from the German UI: the two log buttons used to
    // make the entire settings page wider than a phone screen. Keep them in two
    // columns when they fit and stack them when the translated labels do not.
    EXPECT_TRUE(settingsSource.contains("id: logsButtonsLayout"));
    EXPECT_TRUE(settingsSource.contains(
        "columns: width >= clearLogs.implicitWidth + showLogs.implicitWidth + columnSpacing ? 2 : 1"));
    EXPECT_TRUE(settingsSource.contains("id: showLogs"));
}'''
          if test.count(anchor) != 1:
              raise SystemExit(f'Expected one regression-test anchor, found {test.count(anchor)}')
          test = test.replace(anchor, replacement, 1)
          test_path.write_text(test)

          # Audit remaining multi-button rows. The global contentWidth guard stops
          # them from widening the whole page; this reports candidates that could
          # still benefit from local responsive presentation later.
          lines = settings_path.read_text().splitlines()
          candidates = []
          i = 0
          while i < len(lines):
              if lines[i].strip() != 'RowLayout {':
                  i += 1
                  continue
              start = i
              depth = lines[i].count('{') - lines[i].count('}')
              i += 1
              while i < len(lines) and depth > 0:
                  depth += lines[i].count('{') - lines[i].count('}')
                  i += 1
              block = '\n'.join(lines[start:i])
              count = block.count('Button {')
              if count >= 2:
                  candidates.append((start + 1, count))

          print('Remaining RowLayout blocks containing 2+ Button controls:')
          if not candidates:
              print('  none')
          else:
              for line, count in candidates:
                  print(f'  line {line}: {count} buttons')
          PY

          git fetch origin master
          git checkout origin/master -- .github/workflows/settings-catalog.yml
          rm -f .github/workflows/patch-settings-responsive.yml .settings-layout-trigger

          git config user.name "Roberto Viola"
          git config user.email "Cagnulein@gmail.com"
          git add -A
          git commit -m "fix: make settings layouts width-safe"
          git push origin HEAD:${{ github.head_ref }}

  validate-settings-catalog:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch pull request base
        if: github.event_name == 'pull_request'
        run: git fetch origin "${{ github.base_ref }}:refs/remotes/origin/${{ github.base_ref }}"

      - name: Validate settings catalog
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            python3 tools/check_settings_catalog.py "origin/${{ github.base_ref }}"
          else
            python3 tools/check_settings_catalog.py "HEAD^"
          fi
