name: Fix PR 4947 public Peloton getter

on:
  push:
    branches:
      - codex/add-backward-compatible-inclination-mapping-extension-3shg4d

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/add-backward-compatible-inclination-mapping-extension-3shg4d
      - name: Move Peloton getter to public section
        shell: python
        run: |
          from pathlib import Path
          p = Path('src/homeform.h')
          s = p.read_text()
          old = '    peloton *getPelotonHandler() const { return pelotonHandler; }\n'
          if old not in s:
              raise SystemExit('getPelotonHandler not found')
          s = s.replace(old, '', 1)
          marker = '  public:\n    static homeform *singleton() { return m_singleton; }\n'
          replacement = '  public:\n    static homeform *singleton() { return m_singleton; }\n    peloton *getPelotonHandler() const { return pelotonHandler; }\n'
          if marker not in s:
              raise SystemExit('public marker not found')
          p.write_text(s.replace(marker, replacement, 1))
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/homeform.h
          git commit -m "Expose Peloton handler getter publicly"
          git push origin HEAD:codex/add-backward-compatible-inclination-mapping-extension-3shg4d
