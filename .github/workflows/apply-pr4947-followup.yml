name: Apply PR 4947 follow-up

on:
  push:
    branches:
      - codex/add-backward-compatible-inclination-mapping-extension-3shg4d
  pull_request:
    types: [ready_for_review]

permissions:
  contents: write

jobs:
  apply-followup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/add-backward-compatible-inclination-mapping-extension-3shg4d
          fetch-depth: 0

      - name: Apply remaining treadmill fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f"{path}: expected exactly one match, found {count}")
              p.write_text(text.replace(old, new, 1))

          # Peloton Tread Bootcamp floor/free-mode intervals must remain timed rows and explicitly request speed 0.
          replace_once(
              "src/peloton.cpp",
              '''                bool floorSegment = false;

                if(segment_type.startsWith("floor")) { // bootcamp
                    floorSegment = true;
                }
                
                // Skip if no metrics or invalid offsets
                if ((metrics.isEmpty() || offsets.isEmpty()) && !floorSegment)
                    continue;
''',
              '''                const bool floorSegment = segment_type.contains("floor", Qt::CaseInsensitive) ||
                                          segment_type.contains("free_mode", Qt::CaseInsensitive);

                // Floor segments deliberately have no metrics, but still need valid timing offsets.
                if (offsets.isEmpty() || (metrics.isEmpty() && !floorSegment))
                    continue;
''')

          replace_once(
              "src/peloton.cpp",
              '''                // Apply difficulty settings
                if (difficulty.toUpper() == "LOWER") {
''',
              '''                // A Peloton Tread Bootcamp floor segment is a timed physical stop, not a workout pause.
                if (floorSegment) {
                    row.forcespeed = treadmill_force_speed;
                    row.speed = 0.0;
                    row.lower_speed = 0.0;
                    row.average_speed = 0.0;
                    row.upper_speed = 0.0;
                    qDebug() << row.duration << "Peloton treadmill floor segment - target speed 0"
                             << "time range" << start << "-" << end;
                    trainrows.append(row);
                    continue;
                }

                // Apply difficulty settings
                if (difficulty.toUpper() == "LOWER") {
''')

          # During programmed zero-speed rows, bypass only the speed==0 moving gate.
          # A real/manual paused state must still pause the training program.
          replace_once(
              "src/trainprogram.cpp",
              '''        if ((programmedTreadmillStop || resumingAfterProgrammedStop) &&
            bluetoothManager->device()->isPaused()) {
            qDebug() << QStringLiteral("trainprogram keeping clock active during programmed treadmill stop/resume");
            bluetoothManager->device()->setPaused(false);
        }
    }

    if (rows.count() == 0 || started == false || enabled == false || bluetoothManager->device() == nullptr ||
        (bluetoothManager->device()->currentSpeed().value() <= 0 &&
         !settings.value(QZSettings::continuous_moving, QZSettings::default_continuous_moving).toBool() &&
         !programmedTreadmillStop && !resumingAfterProgrammedStop) ||
        (bluetoothManager->device()->isPaused() && !programmedTreadmillStop && !resumingAfterProgrammedStop)) {
''',
              '''    }

    if (rows.count() == 0 || started == false || enabled == false || bluetoothManager->device() == nullptr ||
        (bluetoothManager->device()->currentSpeed().value() <= 0 &&
         !settings.value(QZSettings::continuous_moving, QZSettings::default_continuous_moving).toBool() &&
         !programmedTreadmillStop && !resumingAfterProgrammedStop) ||
        bluetoothManager->device()->isPaused()) {
''')

          # Do not turn a program-commanded Bootcamp stop into a UI/workout pause.
          replace_once(
              "src/homeform.cpp",
              '''            // originally born for #470. When the treadmill reaches the 0 speed it enters in the pause mode
            // so this logic should care about sync the treadmill state to the UI state
            if (((treadmill *)bluetoothManager->device())->autoPauseWhenSpeedIsZero() &&
                bluetoothManager->device()->currentSpeed().value() == 0 && paused == false && stopped == false) {
''',
              '''            // originally born for #470. When the treadmill reaches the 0 speed it enters in the pause mode
            // so this logic should care about sync the treadmill state to the UI state.
            // A training-program row that explicitly forces speed 0 is a timed physical stop, not a workout pause.
            bool trainingProgramIntentionalStop = false;
            bool trainingProgramResumingAfterStop = false;
            if (trainProgram && trainProgram->isStarted() && !trainProgram->rows.isEmpty()) {
                const int programRowIndex = trainProgram->currentRowIndex();
                if (programRowIndex >= 0 && programRowIndex < trainProgram->rows.size()) {
                    const trainrow &programRow = trainProgram->rows.at(programRowIndex);
                    trainingProgramIntentionalStop = programRow.forcespeed && programRow.speed == 0.0;
                    if (programRowIndex > 0) {
                        const trainrow &previousProgramRow = trainProgram->rows.at(programRowIndex - 1);
                        trainingProgramResumingAfterStop = previousProgramRow.forcespeed &&
                                                           previousProgramRow.speed == 0.0 &&
                                                           programRow.forcespeed && programRow.speed > 0.0 &&
                                                           trainProgram->currentRowElapsedSeconds() <= 10;
                    }
                }
            }

            if (((treadmill *)bluetoothManager->device())->autoPauseWhenSpeedIsZero() &&
                bluetoothManager->device()->currentSpeed().value() == 0 && paused == false && stopped == false &&
                !trainingProgramIntentionalStop && !trainingProgramResumingAfterStop) {
''')

          # Fix the Garmin RSC Sensor Location characteristic UUID typo from the previous follow-up.
          replace_once(
              "src/ios/virtualtreadmill_zwift.swift",
              '''            self.rscSensorLocationCharacteristic = CBMutableCharacteristic(type: RSCServiceUuid,
''',
              '''            self.rscSensorLocationCharacteristic = CBMutableCharacteristic(type: RSCSensorLocationUuid,
''')
          PY

      - name: Validate and commit
        shell: bash
        run: |
          git diff --check
          rm -f .github/workflows/apply-pr4947-followup.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Handle Peloton Tread Bootcamp floor stops"
          git push origin HEAD:codex/add-backward-compatible-inclination-mapping-extension-3shg4d
