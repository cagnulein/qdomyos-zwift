name: Fix settings drawer duplicate background

on:
  push:
    branches:
      - agent/settings-refactor-phase1-safety

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, '[drawer-fixed]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/settings-refactor-phase1-safety
      - name: Remove duplicate Drawer background
        shell: python
        run: |
          from pathlib import Path
          path = Path('src/settings.qml')
          text = path.read_text()
          old = '''            background: Rectangle { color: settingsPane.modernPageColor() }\n            edge: Qt.RightEdge\n            width: Math.min(settingsPane.width, 680)\n            height: settingsPane.height\n            modal: true\n            interactive: true\n\n            background: Rectangle {\n                color: Material.backgroundColor\n            }\n'''
          new = '''            background: Rectangle { color: settingsPane.modernPageColor() }\n            edge: Qt.RightEdge\n            width: Math.min(settingsPane.width, 680)\n            height: settingsPane.height\n            modal: true\n            interactive: true\n'''
          if old not in text:
              raise SystemExit('Expected duplicate Drawer background block not found')
          path.write_text(text.replace(old, new, 1))
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/settings.qml
          git commit -m "Fix duplicate settings Drawer background [drawer-fixed]"
          git push origin HEAD:agent/settings-refactor-phase1-safety
