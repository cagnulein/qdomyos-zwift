name: Settings parity migration

# one-shot trigger
on:
  push:
    branches:
      - agent/settings-refactor-phase1-safety
    paths:
      - '.github/workflows/settings-parity-migration.yml'
      - 'scripts/settings_parity_migration.py'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/settings-refactor-phase1-safety
          fetch-depth: 0
      - name: Apply migration
        run: |
          set -euo pipefail
          python3 scripts/settings_parity_migration.py
          python3 scripts/settings_layout.py --write
          python3 scripts/settings_parity.py --out settings-parity-report
          python3 - <<'PY'
          import json
          r=json.load(open('settings-parity-report/settings-parity.json'))
          row=next(x for x in r['rows'] if x['key']=='app_language')
          print(row)
          assert row['legacy']=='select' and row['modern']=='select' and row['status']=='ok'
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/settings.qml src/settings-catalog.json scripts/settings_parity.py
          git commit -m 'Fix language selector and refine settings parity'
          git push origin HEAD:agent/settings-refactor-phase1-safety
