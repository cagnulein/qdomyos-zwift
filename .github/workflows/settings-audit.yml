name: Settings audit

on:
  push:
    branches:
      - 'fix/settings-drawer-background'
  pull_request:
    paths:
      - 'src/settings*.qml'
      - 'src/settings-catalog.json'
      - 'scripts/settings_audit.py'
      - 'scripts/settings_hierarchy.py'
      - 'scripts/settings_layout.py'
      - 'tests/test_settings_audit.py'
      - 'tests/test_settings_behavior_migration.py'
      - 'tests/test_modern_settings_preview.py'
      - 'tests/test_settings_behavior_parity.py'
      - 'tests/test_settings_hierarchy.py'
      - 'tests/test_settings_ios_layout.py'
      - '.github/workflows/settings-audit.yml'
      - 'docs/settings-refactor-status.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Fix duplicate Drawer background
        if: github.ref_name == 'fix/settings-drawer-background'
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/settings.qml')
          text = path.read_text(encoding='utf-8')
          duplicate = '''            background: Rectangle { color: settingsPane.modernPageColor() }
            edge: Qt.RightEdge
            width: Math.min(settingsPane.width, 680)
            height: settingsPane.height
            modal: true
            interactive: true

            background: Rectangle {
                color: Material.backgroundColor
            }
'''
          fixed = '''            background: Rectangle { color: settingsPane.modernPageColor() }
            edge: Qt.RightEdge
            width: Math.min(settingsPane.width, 680)
            height: settingsPane.height
            modal: true
            interactive: true
'''
          if duplicate in text:
              path.write_text(text.replace(duplicate, fixed, 1), encoding='utf-8')
              print('Removed duplicate Drawer background')
          elif fixed in text:
              print('Drawer background already fixed')
          else:
              raise SystemExit('Expected Drawer block not found')
          PY
      - name: Commit Drawer fix
        if: github.ref_name == 'fix/settings-drawer-background'
        shell: bash
        run: |
          if git diff --quiet -- src/settings.qml; then
            echo 'Drawer fix already committed.'
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add src/settings.qml
            git commit -m 'Fix duplicate modern settings Drawer background'
            git push origin HEAD:fix/settings-drawer-background
          fi
      - name: Fetch latest master
        run: git fetch --no-tags --depth=1 origin master:refs/remotes/origin/master
      - name: Test settings refactor infrastructure
        run: >-
          python3 -m unittest
          tests/test_settings_audit.py
          tests/test_settings_behavior_migration.py
          tests/test_modern_settings_preview.py
          tests/test_settings_behavior_parity.py
          tests/test_settings_hierarchy.py
          tests/test_settings_ios_layout.py
      - name: Validate generated hierarchy and latest-master coverage
        run: |
          python3 scripts/settings_hierarchy.py --master origin/master
          python3 scripts/settings_layout.py
      - name: Resolve and fetch ABI base
        id: base
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
            git fetch --no-tags --depth=1 origin "$BASE_SHA"
            echo "sha=$BASE_SHA" >> "$GITHUB_OUTPUT"
          else
            git fetch --no-tags --depth=1 origin master
            echo "sha=FETCH_HEAD" >> "$GITHUB_OUTPUT"
          fi
      - name: Audit persistent settings ABI and catalog
        run: >-
          python3 scripts/settings_audit.py
          --base "${{ steps.base.outputs.sha }}"
          --report settings-audit.json
      - name: Upload audit inventory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: settings-audit
          path: settings-audit.json
          if-no-files-found: ignore
