name: Temporary Gym Mode HR fix

on:
  push:
    branches:
      - agent/gym-mode-reset-discovery-state

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/gym-mode-reset-discovery-state
          fetch-depth: 0

      - name: Apply minimal fix
        shell: python
        run: |
          from pathlib import Path

          path = Path("src/devices/bluetooth.cpp")
          text = path.read_text()
          old = """    gymModeSessionDevice = normalizedDeviceName;\n    onlyDiscover = false;\n    restart();\n"""
          new = """    gymModeSessionDevice = normalizedDeviceName;\n    onlyDiscover = false;\n    forceHeartBeltOffForTimeout = false;\n    discoveryFinishedHandled = false;\n    restart();\n"""
          if text.count(old) != 1:
              raise SystemExit(f"Expected exactly one target block, found {text.count(old)}")
          path.write_text(text.replace(old, new, 1))

      - name: Commit patch and remove temporary workflow
        run: |
          rm .github/workflows/tmp-gym-mode-hr-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/devices/bluetooth.cpp .github/workflows/tmp-gym-mode-hr-fix.yml
          git diff --cached --check
          git commit -m "Reset Gym Mode discovery state"
          git push origin HEAD:agent/gym-mode-reset-discovery-state
