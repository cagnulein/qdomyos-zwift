name: Finish power calibration wiring

on:
  push:
    branches:
      - feature/power-calibration-table
    paths:
      - .github/workflows/finish-power-calibration.yml

permissions:
  contents: write

jobs:
  patch-settings:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/power-calibration-table
          fetch-depth: 0

      - name: Patch settings.qml
        shell: python
        run: |
          from pathlib import Path

          path = Path('src/settings.qml')
          text = path.read_text()

          custom_block = '''                    NewPageElement {
                              title: qsTr("Custom Gear Table")
                              indicatRectColor: Material.color(Material.Grey)
                              textColor: Material.color(Material.Yellow)
                              color: Material.backgroundColor
                              accordionContent: "customgears.qml"
                          }'''

          power_block = '''

                    NewPageElement {
                              title: qsTr("Power Calibration Table")
                              indicatRectColor: Material.color(Material.Grey)
                              textColor: Material.color(Material.Yellow)
                              color: Material.backgroundColor
                              accordionContent: "powercalibration.qml"
                          }'''

          if 'accordionContent: "powercalibration.qml"' not in text:
              if custom_block not in text:
                  raise SystemExit('Custom Gear Table block not found')
              text = text.replace(custom_block, custom_block + power_block, 1)

          if 'property bool power_calibration_table_enabled:' not in text:
              marker = '// always add a property at the end of the file to avoid corruption of the settings when loading old versions'
              marker_pos = text.find(marker)
              if marker_pos < 0:
                  raise SystemExit('Settings marker not found')

              settings_pos = text.find('Settings {', marker_pos)
              if settings_pos < 0:
                  raise SystemExit('Settings block not found')

              brace_pos = text.find('{', settings_pos)
              depth = 0
              in_string = None
              escape = False
              line_comment = False
              block_comment = False
              i = brace_pos
              end_pos = None

              while i < len(text):
                  ch = text[i]
                  nxt = text[i + 1] if i + 1 < len(text) else ''

                  if line_comment:
                      if ch == '\n':
                          line_comment = False
                      i += 1
                      continue

                  if block_comment:
                      if ch == '*' and nxt == '/':
                          block_comment = False
                          i += 2
                      else:
                          i += 1
                      continue

                  if in_string:
                      if escape:
                          escape = False
                      elif ch == '\\':
                          escape = True
                      elif ch == in_string:
                          in_string = None
                      i += 1
                      continue

                  if ch == '/' and nxt == '/':
                      line_comment = True
                      i += 2
                      continue
                  if ch == '/' and nxt == '*':
                      block_comment = True
                      i += 2
                      continue
                  if ch in ('"', "'"):
                      in_string = ch
                      i += 1
                      continue
                  if ch == '{':
                      depth += 1
                  elif ch == '}':
                      depth -= 1
                      if depth == 0:
                          end_pos = i
                          break
                  i += 1

              if end_pos is None:
                  raise SystemExit('Could not find end of Settings block')

              insertion = ('            property bool power_calibration_table_enabled: false\n'
                           '            property string power_calibration_table: "0|0\\n100|100\\n200|200\\n300|300\\n400|400\\n500|500\\n600|600"\n')
              text = text[:end_pos] + insertion + text[end_pos:]

          path.write_text(text)

      - name: Commit final wiring and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/finish-power-calibration.yml
          git add -- src/settings.qml
          git commit -m "Add power calibration settings entry"
          git push origin HEAD:feature/power-calibration-table
