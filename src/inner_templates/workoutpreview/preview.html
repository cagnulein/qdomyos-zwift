<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>Workout Preview</title>
    <script src="../i18n/i18n.js"></script>
    <!-- Modern look: the app theme from the URL fragment (TrainingProgramsListJS.qml); without it
         the page keeps its own look -->
    <script src="../chartjs/qz-theme-bridge.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* the chart takes the height of the view: a fixed 400px was cut at the bottom (no time axis)
           in the program preview, lower than that both upright and in landscape */
        html, body {
            height: 100%;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #1d2330;
            color: white;
            padding: 10px;
        }

        /* The charts fill the view (the body padding off). One metric takes the whole height;
           several share it, each chart no lower than 140px (qzmetriccharts.js); when they do not
           fit (a phone held sideways), all of them start on one shared chart, and the page
           scrolls only after the chips split them */
        #chart-container {
            width: 100%;
            min-height: calc(100vh - 20px);
            background: white;
            color: #333;
            border-radius: 8px;
            padding: 10px;
        }

        canvas {
            width: 100% !important;
            height: 100% !important;
        }

        /* Modern look (qz-theme-bridge.js): the page in the app theme, so the frame merges with
           the page, and the chart on a surface card in every theme, as on the charts and the
           workout editor; the page sets the 16 at the sides around the view (the margins of the
           QML page), so the card takes the whole view */
        html.modern body {
            background: var(--qz-bg);
            color: var(--qz-text);
            padding: 0;
            font-family: Roboto, 'Segoe UI', sans-serif;
        }

        html.modern #chart-container {
            min-height: 100vh;
            background: var(--qz-surface);
            color: var(--qz-text);
            border-radius: var(--qz-radius-card, 16px);
            padding: 12px;
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@3.9.1/dist/chart.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns@2.0.0/dist/chartjs-adapter-date-fns.bundle.min.js"></script>
    <script src="../chartjs/qzcharttheme.js"></script>
    <script src="../chartjs/qzmetriccharts.js"></script>
</head>
<body>
    <div id="chart-container"></div>

    <script>
        let miles = 1; // 1 = km, 0.621371 = miles

        function tq(key, fallback) {
            return window.qzTranslate ? window.qzTranslate(key, fallback) : fallback;
        }

        // All the metrics the program sets, each on its own chart (qzmetriccharts.js); the
        // chips at the top right put the ticked ones together on a shared chart. Before, one
        // main line by the guessed device and at most one more were drawn: a program with
        // cadence and no power showed only the speed, unset (-1).
        let charts = null;

        // The selected workout time is a visual marker, not a motor command.
        // Only an explicit press of "Resume from here" starts a selected interval.
        let totalPreviewSeconds = 0;
        let selectedPreviewSecond = 0;
        let seekEnabled = false;
        let draggingCanvas = null;

        function timeLabel(seconds) {
            const s = Math.max(0, Math.round(seconds));
            const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), sec = s % 60;
            return (h ? h + ':' + String(m).padStart(2, '0') : String(m)) +
                ':' + String(sec).padStart(2, '0');
        }

        Chart.register({
            id: 'qz-workout-preview-playhead',
            afterDraw: function (chart) {
                const host = document.getElementById('chart-container');
                if (!host.contains(chart.canvas) || totalPreviewSeconds <= 0 || !chart.scales.x)
                    return;
                const scale = chart.scales.x;
                const area = chart.chartArea;
                const x = Math.max(area.left, Math.min(area.right, scale.getPixelForValue(selectedPreviewSecond)));
                const ctx = chart.ctx;
                ctx.save();
                ctx.strokeStyle = '#e11d48';
                ctx.lineWidth = 2;
                ctx.setLineDash([5, 3]);
                ctx.beginPath();
                ctx.moveTo(x, area.top);
                ctx.lineTo(x, area.bottom);
                ctx.stroke();
                ctx.setLineDash([]);
                const label = timeLabel(selectedPreviewSecond) + ' / ' + timeLabel(totalPreviewSeconds);
                ctx.font = '12px sans-serif';
                const width = ctx.measureText(label).width + 12;
                const left = Math.min(Math.max(area.left, x - width / 2), Math.max(area.left, area.right - width));
                ctx.fillStyle = '#e11d48';
                ctx.fillRect(left, area.top + 3, width, 20);
                ctx.fillStyle = 'white';
                ctx.fillText(label, left + 6, area.top + 17);
                ctx.restore();
            }
        });

        function selectPreviewSecond(seconds, sync) {
            if (!seekEnabled || !Number.isFinite(seconds))
                return;
            const next = Math.max(0, Math.min(totalPreviewSeconds - 1, Math.round(seconds)));
            selectedPreviewSecond = next;
            document.querySelectorAll('#chart-container canvas').forEach(function (canvas) {
                const chart = Chart.getChart(canvas);
                if (chart)
                    chart.draw();
            });
            if (sync && ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({ msg: 'setworkoutpreviewseek', content: { seconds: next } }));
            }
        }

        function secondFromPointer(event, canvas) {
            const chart = Chart.getChart(canvas);
            if (!chart || !chart.scales.x)
                return null;
            const rect = canvas.getBoundingClientRect();
            return chart.scales.x.getValueForPixel(event.clientX - rect.left);
        }

        const previewHost = document.getElementById('chart-container');
        previewHost.addEventListener('pointerdown', function (event) {
            if (!seekEnabled || event.target.tagName !== 'CANVAS')
                return;
            draggingCanvas = event.target;
            selectPreviewSecond(secondFromPointer(event, draggingCanvas), false);
            if (draggingCanvas.setPointerCapture)
                draggingCanvas.setPointerCapture(event.pointerId);
        });
        previewHost.addEventListener('pointermove', function (event) {
            if (draggingCanvas)
                selectPreviewSecond(secondFromPointer(event, draggingCanvas), false);
        });
        previewHost.addEventListener('pointerup', function (event) {
            if (!draggingCanvas)
                return;
            selectPreviewSecond(secondFromPointer(event, draggingCanvas), true);
            draggingCanvas = null;
        });
        previewHost.addEventListener('pointercancel', function () { draggingCanvas = null; });


        // The speed comes in km/h: shown in miles when the app uses them (an unset -1 stays
        // below zero, a gap)
        function speedPoints(list) {
            return list.map(function (p) {
                return p && p.y >= 0 ? Object.assign({}, p, { y: p.y * miles }) : p;
            });
        }

        // The incline below -50 (unset) is not sent at all: a missing second becomes a gap
        // instead of a line drawn across it
        function everySecond(list, count) {
            const byX = {};
            list.forEach(function (p) {
                if (p) {
                    byX[p.x] = p;
                }
            });
            const out = [];
            for (let x = 0; x < count; x++) {
                out.push(byX[x] || { x: x, y: null });
            }
            return out;
        }

        function metricSeries(workoutData, deviceType) {
            const seconds = workoutData.watts.length;
            const all = {
                power: { key: 'power', label: tq('workoutEditor.power', 'Power'), unit: tq('unit.w', 'W'), color: '#3b82f6', points: workoutData.watts },
                speed: { key: 'speed', label: tq('workoutEditor.speed', 'Speed'), unit: miles === 1 ? tq('unit.kmh', 'km/h') : tq('unit.mph', 'mph'), color: '#06b6d4', points: speedPoints(workoutData.speed) },
                inclination: { key: 'inclination', label: tq('workoutEditor.incline', 'Incline'), unit: '%', color: '#10b981', points: everySecond(workoutData.inclination, seconds), floor: -50 },
                resistance: { key: 'resistance', label: tq('workoutEditor.resistance', 'Resistance'), unit: '', color: '#8b5cf6', points: workoutData.resistance },
                cadence: { key: 'cadence', label: tq('workoutEditor.cadence', 'Cadence'), unit: tq('unit.rpm', 'rpm'), color: '#f59e0b', points: workoutData.cadence }
            };
            // The device's own metrics first
            const order = deviceType === 'treadmill'
                ? ['speed', 'inclination', 'power', 'resistance', 'cadence']
                : deviceType === 'elliptical' || deviceType === 'rower'
                    ? ['power', 'resistance', 'cadence', 'inclination', 'speed']
                    : ['power', 'cadence', 'resistance', 'speed', 'inclination'];
            return order.map(function (key) { return all[key]; });
        }

        function updateWorkoutChart(workoutData, deviceType) {
            if (!charts) {
                charts = QzMetricCharts.create(document.getElementById('chart-container'), {
                    storageKey: 'qz.workoutpreview.together',
                    timeTitle: function () { return tq('workoutEditor.time', 'Time'); },
                    caption: function () { return tq('chart.onOneChart', 'On one chart:'); },
                    // the axes in the theme of the page (qzChartTheme leaves the classic look as is)
                    make: function (ctx, config) { return qzChartTheme.create(ctx, config); },
                    restyle: function (chart, config) { qzChartTheme.restyle(chart, config); },
                    // the chips of the modern look as in the workout editor: a selected one filled
                    // with the accent of the theme; on the dark card a light outline
                    colors: function () {
                        var root = document.documentElement.classList;
                        if (!root.contains('modern'))
                            return {};
                        var tonal = window.qzAccentTonal ? window.qzAccentTonal(0.24) : null;
                        var out = root.contains('light') ? {} : { outline: 'rgba(255,255,255,0.38)', tonal: 'rgba(255,255,255,0.16)' };
                        if (tonal)
                            out.tonal = tonal;
                        return out;
                    },
                    // the view less the padding of the body and of the card: classic 10 + 10 above
                    // and below; modern - none on the body, 12 on the card
                    fitHeight: function () {
                        return window.innerHeight - (document.documentElement.classList.contains('modern') ? 24 : 40);
                    }
                });
                // the chips take their colours when drawn: redraw them in a new theme
                window.addEventListener('qzthemechange', function () { charts.refresh(); });
            }
            let total = 0;
            ['watts', 'speed', 'inclination', 'resistance', 'cadence'].forEach(function (key) {
                (workoutData[key] || []).forEach(function (p) {
                    if (p && p.x > total) {
                        total = p.x;
                    }
                });
            });
            charts.update({ totalSeconds: total, series: metricSeries(workoutData, deviceType) });
        }

        // WebSocket for communication with Qt
        let ws = null;
        let requestTimer = null;
        let lastDataHash = null; // Track last received data to avoid unnecessary redraws

        // Send request for workout preview data
        function requestWorkoutPreview() {
            if (!ws || ws.readyState !== WebSocket.OPEN) {
                return;
            }

            const message = {
                msg: 'getworkoutpreview',
                content: {}
            };

            console.log('Requesting workout preview data');
            ws.send(JSON.stringify(message));
        }

        // WebSocket setup
        function setupWebSocket() {
            const host = (!location.host || location.host.length == 0) ? 'localhost:6666' : location.host;
            const wsUrl = `ws://${host}/workoutpreview-ws`;

            console.log('Connecting to WebSocket:', wsUrl);
            ws = new WebSocket(wsUrl);

            ws.onopen = function() {
                console.log('WebSocket connected');
                ws.send(JSON.stringify({ msg: 'webtranslations', content: {} }));

                // Request initial data
                requestWorkoutPreview();

                // Set up periodic updates (every 500ms to catch changes)
                if (requestTimer) {
                    clearInterval(requestTimer);
                }
                requestTimer = setInterval(requestWorkoutPreview, 500);
            };

            ws.onmessage = function(event) {
                try {
                    const data = JSON.parse(event.data);
                    handleMessage(data);
                } catch (e) {
                    console.error('Error parsing message:', e);
                }
            };

            ws.onerror = function(error) {
                console.error('WebSocket error:', error);
            };

            ws.onclose = function() {
                console.log('WebSocket closed, attempting reconnect in 5 seconds');
                if (requestTimer) {
                    clearInterval(requestTimer);
                    requestTimer = null;
                }
                setTimeout(setupWebSocket, 5000);
            };
        }

        // Handle incoming WebSocket messages
        function handleMessage(data) {
            console.log('Received message:', data);

            const msgType = data.type || data.msg;

            if (msgType === 'workoutpreview' || msgType === 'R_workoutpreview') {
                const content = data.content || data;
                updateWorkoutFromData(content);
            } else if (msgType === 'R_webtranslations') {
                window.qzSetTranslations(data.content || {});
                lastDataHash = null;
            }
        }

        // Update chart from WebSocket data
        function updateWorkoutFromData(data) {
            // Create a hash of the data to detect changes
            const dataHash = JSON.stringify({
                points: data.points,
                watts: data.watts,
                speed: data.speed,
                inclination: data.inclination,
                resistance: data.resistance,
                cadence: data.cadence,
                segments: data.segments,
                hasOpenEndedSteps: data.hasOpenEndedSteps,
                deviceType: data.deviceType,
                seekSupported: data.seekSupported
            });

            // Only update if data has changed
            if (dataHash === lastDataHash) {
                return;
            }

            lastDataHash = dataHash;

            const { points, watts, speed, inclination, resistance, cadence, segments, hasOpenEndedSteps, deviceType, miles_unit } = data;

            // Changing the preview resets any previous selection; unsupported workouts
            // still show the position marker but cannot seek past distance/HR barriers.
            const nextTotal = Math.max(0, Number(points) || 0);
            seekEnabled = Boolean(data.seekSupported);
            if (nextTotal !== totalPreviewSeconds || !seekEnabled)
                selectedPreviewSecond = 0;
            totalPreviewSeconds = nextTotal;

            // Update miles setting if provided
            if (miles_unit !== undefined) {
                miles = miles_unit ? 0.621371 : 1;
            }

            const workoutData = {
                watts: watts || [],
                speed: speed || [],
                inclination: inclination || [],
                resistance: resistance || [],
                cadence: cadence || [],
                segments: segments || [],
                hasOpenEndedSteps: hasOpenEndedSteps || false
            };

            // The C++ backend sends every metric for every second, an unset one as y = -1:
            // detect the actual device type from the set values (it orders the charts)
            function hasSet(list) {
                return list.some(function(p) {
                    return (p !== null && typeof p === 'object' && p.y !== undefined) ? p.y >= 0 : Number(p) >= 0;
                });
            }
            var actualDeviceType = deviceType || 'bike';
            if (!hasSet(workoutData.watts)) {
                if (hasSet(workoutData.speed)) {
                    actualDeviceType = 'treadmill';
                } else if (hasSet(workoutData.resistance)) {
                    actualDeviceType = 'elliptical';
                }
            }

            console.log('Updating chart with new data');
            updateWorkoutChart(workoutData, actualDeviceType);
        }

        // External API for backwards compatibility (if needed)
        window.setWorkoutData = updateWorkoutFromData;

        // Initialize WebSocket connection
        setupWebSocket();

        // Initialize with empty chart
        window.addEventListener('load', function() {
            updateWorkoutChart({
                watts: [],
                speed: [],
                inclination: [],
                resistance: []
            }, 'bike');
        });
    </script>
</body>
</html>
