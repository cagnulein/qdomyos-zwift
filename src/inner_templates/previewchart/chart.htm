<script>
// Read the persistent order from Settings > Workout History Charts.
(function () {
    "use strict";
    var charts = [
        { id: "power", key: "history_chart_power_order", fallback: 0 },
        { id: "heart", key: "history_chart_heart_order", fallback: 1 },
        { id: "resistance", key: "history_chart_resistance_order", fallback: 2 },
        { id: "pelotonResistance", key: "history_chart_peloton_resistance_order", fallback: 3 },
        { id: "cadence", key: "history_chart_cadence_order", fallback: 4 },
        { id: "powerDistribution", key: "history_chart_power_distribution_order", fallback: 5 },
        { id: "speedInclination", key: "history_chart_speed_inclination_order", fallback: 6 }
    ];
    var container = document.getElementById("history-charts");

    function reorder(settings) {
        var sorted = charts.slice();
        function position(chart) {
            var value = settings && settings[chart.key];
            if (value === null || value === undefined) return chart.fallback;
            var number = Number(value);
            return isFinite(number) && Math.floor(number) === number &&
                   number >= 0 && number < charts.length ? number : chart.fallback;
        }
        sorted.sort(function(a, b) {
            return position(a) - position(b) || a.fallback - b.fallback;
        });
        sorted.forEach(function(chart) {
            var section = container.querySelector('[data-history-chart="' + chart.id + '"]');
            if (section) container.appendChild(section);
        });
    }

    var request = new MainWSQueueElement({
        msg: "getsettings", content: {keys: charts.map(function(chart) { return chart.key; })}
    }, function (response) {
        return response.msg === "R_getsettings" ? response.content : null;
    }, 5000, 3);

    request.enqueue().then(function (settings) {
        reorder(settings);
    }).catch(function (error) {
        console.error("Could not load workout history chart order:", error);
        // The charts stay in their original order if the setting is unavailable.
    });
})();
</script>
